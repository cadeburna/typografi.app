<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
    <title>typografi.app</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #080c10;
        color: #fff;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 400;
        font-variant-ligatures: common-ligatures;
        font-feature-settings: "liga", "kern", "calt";
        letter-spacing: -0.05em;
        font-size: clamp(2.5rem, 8vw, 5rem);
      }
      p {
        margin: 14px 0 0;
        font-family: "Playfair Display", Georgia, serif;
        font-style: italic;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        color: rgba(255, 255, 255, 0.65);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>typografi</h1>
      <p>Coming soon.</p>
    </div>
  </body>
</html>
